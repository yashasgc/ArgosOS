name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    name: macOS (x64 + arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build standalone Python environment
        run: |
          python3 -m venv standalone-python-env
          standalone-python-env/bin/pip install --upgrade pip wheel --quiet
          standalone-python-env/bin/pip install --quiet \
            "fastapi>=0.104.0" "uvicorn[standard]>=0.24.0" \
            "sqlalchemy>=2.0.23" "alembic>=1.12.1" \
            "pydantic>=2.5.0" "pydantic-settings>=2.1.0" \
            "python-multipart>=0.0.6" "pytesseract>=0.3.10" \
            "Pillow>=10.0.0" "pdfminer-six>=20221105" \
            "python-docx>=1.1.0" "openai>=1.3.7" \
            "python-dotenv>=1.0.0" "cryptography>=41.0.0" \
            "PyMuPDF>=1.26.4"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Package (x64)
        working-directory: frontend
        run: npx electron-builder --mac --x64 --publish=never
        env:
          ELECTRON_RUN_AS_NODE: ""

      - name: Package (arm64)
        working-directory: frontend
        run: npx electron-builder --mac --arm64 --publish=never
        env:
          ELECTRON_RUN_AS_NODE: ""

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: frontend/dist-electron/*.dmg

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build standalone Python environment
        run: |
          python -m venv standalone-python-env
          standalone-python-env\Scripts\pip install --upgrade pip wheel --quiet
          standalone-python-env\Scripts\pip install --quiet `
            "fastapi>=0.104.0" "uvicorn[standard]>=0.24.0" `
            "sqlalchemy>=2.0.23" "alembic>=1.12.1" `
            "pydantic>=2.5.0" "pydantic-settings>=2.1.0" `
            "python-multipart>=0.0.6" "pytesseract>=0.3.10" `
            "Pillow>=10.0.0" "pdfminer-six>=20221105" `
            "python-docx>=1.1.0" "openai>=1.3.7" `
            "python-dotenv>=1.0.0" "cryptography>=41.0.0" `
            "PyMuPDF>=1.26.4"
        shell: powershell

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Package
        working-directory: frontend
        run: npx electron-builder --win --x64 --publish=never
        env:
          ELECTRON_RUN_AS_NODE: ""

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: frontend/dist-electron/*.exe

  build-linux:
    name: Linux (x64 AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system deps (Tesseract)
        run: sudo apt-get install -y tesseract-ocr

      - name: Build standalone Python environment
        run: |
          python3 -m venv standalone-python-env
          standalone-python-env/bin/pip install --upgrade pip wheel --quiet
          standalone-python-env/bin/pip install --quiet \
            "fastapi>=0.104.0" "uvicorn[standard]>=0.24.0" \
            "sqlalchemy>=2.0.23" "alembic>=1.12.1" \
            "pydantic>=2.5.0" "pydantic-settings>=2.1.0" \
            "python-multipart>=0.0.6" "pytesseract>=0.3.10" \
            "Pillow>=10.0.0" "pdfminer-six>=20221105" \
            "python-docx>=1.1.0" "openai>=1.3.7" \
            "python-dotenv>=1.0.0" "cryptography>=41.0.0" \
            "PyMuPDF>=1.26.4"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Package
        working-directory: frontend
        run: npx electron-builder --linux --x64 --publish=never
        env:
          ELECTRON_RUN_AS_NODE: ""

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: frontend/dist-electron/*.AppImage
