[tool.poetry]
name = "argos-os"
version = "1.0.0"
description = "Intelligent file analysis and document management system"
authors = ["ArgosOS Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115,<1"
uvicorn = {extras = ["standard"], version = ">=0.31.1,<1"}
sqlalchemy = "^2.0.23"
alembic = "^1.12.1"
pydantic = ">=2.11,<3"
pydantic-settings = ">=2.9,<3"
python-multipart = ">=0.0.9,<1"
pytesseract = "^0.3.10"
Pillow = "^10.0.0"
pdfminer-six = "^20221105"
python-docx = "^1.1.0"
openai = "^1.3.7"
python-dotenv = "^1.0.0"
cryptography = "^41.0.0"
PyMuPDF = "^1.26.4"
mcp = ">=2,<3"

[tool.poetry.scripts]
argos-mcp = "app.mcp.server:main"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
httpx = "^0.25.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

